[project]
name = "stock-monitor"
version = "0.7.0"
description = "每日股票监控系统 (A股 + 美股 + 港股)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.25.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "akshare>=1.14.0",
    "mootdx>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
web = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]
data-sources = [
    "requests>=2.31.0",
    "stockstats>=0.6.5",
    "numpy>=1.26.0",
    "baostock>=0.8.9",
    "xlrd>=2.0.1",
    "openpyxl>=3.1.0",
]

[project.scripts]
stock-monitor = "src.main:cli"
stock-monitor-web = "src.web:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
